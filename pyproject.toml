[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-security-lab"
version = "0.1.0"
description = "A safe, local lab for researching vulnerabilities in RAG and agentic AI systems."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oran Ben Shushan" }]
keywords = ["ai-security", "rag-security", "prompt-injection", "agentic-ai"]
dependencies = [
    "chromadb>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
